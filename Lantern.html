<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen viewer. A glowing stage with a transport bar beneath it on the left, a library column on the right. Stacks to one column on phones. */
:root{
  --bg:#e9ecf4;
  --surface:#f6f7fb;
  --surface-2:#dde1ee;
  --stage:#d8dcec;
  --fg:#12162a;
  --muted:#566080;
  --line:#c8cee0;
  --accent:#a65200;
  --accent-fg:#ffffff;
  --glow:#f0a43a;
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f1e;--surface:#141932;--surface-2:#1e2545;--stage:#090b17;
    --fg:#edf0fb;--muted:#9aa2c4;--line:#283055;
    --accent:#f4b13f;--accent-fg:#1b1204;--glow:#f4b13f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f1e;--surface:#141932;--surface-2:#1e2545;--stage:#090b17;
  --fg:#edf0fb;--muted:#9aa2c4;--line:#283055;
  --accent:#f4b13f;--accent-fg:#1b1204;--glow:#f4b13f;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;gap:16px;padding-inline:clamp(16px,3vw,36px);padding-block:16px;max-width:1680px;margin-inline:auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand b{font:700 1.4rem/1 var(--font-display);letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* icon buttons */
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--fg);flex:none}
.ib:hover{background:var(--surface-2)}
.ib:disabled{opacity:.35;cursor:default}
.ib[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.play{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-fg)}
.ib.play:hover{filter:brightness(1.08);background:var(--accent)}
.ib.play svg{width:22px;height:22px}

/* main layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,26vw,360px);gap:20px}
.player{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.player:fullscreen{background:var(--bg);padding:16px}

/* stage */
.stage{position:relative;flex:1;min-height:0;border-radius:20px;overflow:hidden;background:var(--stage);border:1px solid var(--line);display:grid;place-items:center;isolation:isolate}
.stage::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(70% 65% at 50% 0%,color-mix(in srgb,var(--glow) 24%,transparent),transparent 72%)}
.backdrop{position:absolute;inset:-12%;z-index:-1;background-size:cover;background-position:center;filter:blur(56px) saturate(1.4);opacity:.5;transition:opacity .4s;pointer-events:none}

.imgbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(12px,2vw,28px);overflow:hidden}
.imgbox img{min-width:0;min-height:0;max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 24px 64px rgba(5,8,20,.4);transform-origin:center;user-select:none;-webkit-user-drag:none;will-change:transform}
.imgbox.zoomed{cursor:grab;touch-action:none}
.imgbox.panning{cursor:grabbing}

.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.bigplay{position:absolute;left:50%;top:50%;translate:-50% -50%;width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.bigplay svg{width:32px;height:32px;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}

.audiobox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3.5vh,30px);padding:20px}
.art{width:clamp(120px,min(34vh,50vw),300px);aspect-ratio:1;max-width:100%;border-radius:18px;background-size:cover;background-position:center;display:grid;place-items:center;box-shadow:0 24px 64px rgba(5,8,20,.45);color:rgba(255,255,255,.78)}
.art svg{width:38%;height:38%;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.audiobox canvas{width:min(100%,620px);height:clamp(70px,16vh,140px);display:block}

.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;max-width:480px}
.empty h1{font:700 clamp(1.6rem,3.4vw,2.4rem)/1.1 var(--font-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.formats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

/* meta */
.meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font:700 clamp(1.3rem,2.4vw,1.9rem)/1.15 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.subtitle{margin:0;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 .7rem/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap}
.tag.hot{color:var(--accent);border-color:currentColor}

/* controls */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.transport,.extras{display:flex;align-items:center;gap:4px}
.extras{margin-left:auto;gap:8px}
.timeline{flex:1 1 260px;display:flex;align-items:center;gap:10px;min-width:0}
.timeline .mono{font-size:.78rem;color:var(--muted);min-width:3.2em}
.timeline .mono:last-child{text-align:right}
.chip{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font:500 .78rem/1 var(--font-mono);min-width:3.4em}
.chip:hover{background:var(--surface-2)}
.zoomgrp{display:flex;align-items:center;gap:2px}
.zoomgrp .chip{border:0;min-width:3.6em}
.vol{display:flex;align-items:center;gap:2px}
.vol input{width:84px}

input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;margin:0;flex:1;min-width:0;cursor:pointer}
input[type="range"]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type="range"]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type="range"]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--fg);border:0;margin-top:-5px}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:0}

/* library */
.library{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 14px 10px 18px}
.lib-head h2{margin:0;font:700 1.05rem/1 var(--font-display);letter-spacing:-.01em}
.lib-head .mono{font-size:.74rem;color:var(--muted);margin-left:8px;font-weight:400}
.ghost{border:0;background:transparent;color:var(--muted);font-size:.82rem;padding:6px 10px;border-radius:8px}
.ghost:hover{background:var(--surface-2);color:var(--fg)}
.list{list-style:none;margin:0;padding:0 8px 8px;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.list li{position:relative}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:8px;padding-right:44px;border:0;border-radius:12px;background:transparent;text-align:left;min-width:0}
.row:hover{background:var(--surface-2)}
.row[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.thumb{width:52px;height:52px;border-radius:9px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.art-tile{color:rgba(255,255,255,.85)}
.thumb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rtext{display:flex;flex-direction:column;min-width:0;gap:2px}
.rname{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{position:absolute;right:16px;top:50%;translate:0 -50%;display:none;gap:2px;align-items:flex-end;height:14px}
.eq i{display:block;width:3px;height:100%;background:var(--accent);border-radius:1px;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}
.eq i:nth-child(3){animation-delay:-.6s}
.row.playing + .rm{opacity:0}
.row.playing ~ .eq{display:flex}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.rm{position:absolute;right:8px;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;opacity:0}
.rm svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.list li:hover .rm,.rm:focus-visible,.list li:focus-within .rm{opacity:1}
.list li:hover .eq{opacity:0}
.rm:hover{background:var(--surface-2);color:var(--fg)}
@media (hover:none){.rm{opacity:.7}}
.lib-empty{padding:28px 18px;color:var(--muted);text-align:center;font-size:.9rem}
.lib-foot{padding:10px 12px 12px;border-top:1px solid var(--line)}
.lib-foot .btn{width:100%;justify-content:center}

.is-empty .meta,.is-empty .controls{display:none}

/* overlays */
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.veil div{border:2px dashed var(--accent);border-radius:24px;padding:clamp(28px,6vw,56px) clamp(28px,8vw,72px);font:700 clamp(1.4rem,3vw,2rem)/1.1 var(--font-display);letter-spacing:-.02em;text-align:center;margin:16px}
.toast{position:fixed;left:50%;translate:-50% 0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,460px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.88rem;box-shadow:0 12px 40px rgba(0,0,0,.35)}

@media (max-width:899px){
  html,body{height:auto}
  .app{height:auto}
  .layout{display:flex;flex-direction:column}
  .player{min-height:auto}
  .stage{flex:none;height:min(62vh,520px)}
  .library{max-height:none}
  .list{overflow:visible}
  .brand span{display:none}
}
@media (max-width:700px){
  .timeline{order:3;flex-basis:100%}
  .vol input{width:64px}
}
@media (prefers-reduced-motion:reduce){
  .eq i{animation:none;transform:scaleY(.6)}
  .backdrop{transition:none}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M12 8a4 4 0 0 1 8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="10" y="8" width="12" height="3" rx="1.5" fill="currentColor"/>
        <path d="M9 12h14l-1.4 13a2 2 0 0 1-2 1.8h-7.2a2 2 0 0 1-2-1.8z" fill="var(--glow)"/>
        <path d="M9 12h14l-1.4 13a2 2 0 0 1-2 1.8h-7.2a2 2 0 0 1-2-1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <ellipse cx="16" cy="20" rx="2.2" ry="3.4" fill="var(--accent-fg)" opacity=".85"/>
        <rect x="10" y="27.4" width="12" height="2.2" rx="1.1" fill="currentColor"/>
      </svg>
      <b>Lantern</b>
      <span>Photos, music and video from your device</span>
    </div>
    <div class="top-actions">
      <button class="btn primary" id="openBtn" type="button"><span data-i="upload"></span>Open files</button>
      <button class="ib" id="themeBtn" type="button" aria-label="Switch light and dark theme" data-i="contrast"></button>
    </div>
  </header>

  <main class="layout">
    <section class="player is-empty" id="player" aria-label="Viewer">
      <div class="stage" id="stage">
        <div class="backdrop" id="backdrop" aria-hidden="true"></div>

        <div class="empty" id="empty">
          <h1>Drop a photo, a song or a film</h1>
          <p>Lantern plays files straight from your device. Nothing is uploaded.</p>
          <button class="btn primary" id="emptyBtn" type="button"><span data-i="upload"></span>Choose files</button>
          <div class="formats" aria-label="Supported formats">
            <span class="tag">JPG</span><span class="tag">PNG</span><span class="tag">GIF</span><span class="tag">WEBP</span>
            <span class="tag">MP3</span><span class="tag">WAV</span><span class="tag">FLAC</span><span class="tag">M4A</span>
            <span class="tag">MP4</span><span class="tag">WEBM</span><span class="tag">MOV</span>
          </div>
        </div>

        <div class="imgbox" id="imgBox" hidden><img id="img" alt=""></div>
        <video id="video" playsinline preload="metadata" hidden></video>
        <button class="bigplay" id="bigPlay" type="button" aria-label="Play video" hidden data-i="play"></button>
        <div class="audiobox" id="audioBox" hidden>
          <div class="art" id="art"><span data-i="music" style="display:contents"></span></div>
          <canvas id="viz" aria-hidden="true"></canvas>
        </div>
        <audio id="audio" preload="metadata"></audio>
      </div>

      <div class="meta" id="meta">
        <h2 class="title" id="title"></h2>
        <p class="subtitle" id="subtitle" hidden></p>
        <div class="tags" id="tags"></div>
      </div>

      <div class="controls" id="controls">
        <div class="transport">
          <button class="ib" id="shuffleBtn" type="button" aria-label="Shuffle" aria-pressed="false" data-i="shuffle"></button>
          <button class="ib" id="prevBtn" type="button" aria-label="Previous" data-i="prev"></button>
          <button class="ib play" id="playBtn" type="button" aria-label="Play" data-for="media" data-i="play"></button>
          <button class="ib" id="nextBtn" type="button" aria-label="Next" data-i="next"></button>
          <button class="ib" id="loopBtn" type="button" aria-label="Repeat this file" aria-pressed="false" data-for="media" data-i="repeat"></button>
        </div>
        <div class="timeline" data-for="media">
          <span class="mono" id="tNow">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span class="mono" id="tDur">0:00</span>
        </div>
        <div class="extras">
          <div class="zoomgrp" data-for="image">
            <button class="ib" id="zoomOut" type="button" aria-label="Zoom out" data-i="zoomout"></button>
            <button class="chip" id="zoomLbl" type="button" aria-label="Reset zoom">Fit</button>
            <button class="ib" id="zoomIn" type="button" aria-label="Zoom in" data-i="zoomin"></button>
          </div>
          <button class="chip" id="speedBtn" type="button" data-for="media" aria-label="Playback speed">1×</button>
          <div class="vol" data-for="media">
            <button class="ib" id="muteBtn" type="button" aria-label="Mute" data-i="volume"></button>
            <input type="range" id="vol" min="0" max="100" value="80" step="1" aria-label="Volume">
          </div>
          <button class="ib" id="fsBtn" type="button" aria-label="Full screen" data-for="visual" data-i="fullscreen"></button>
        </div>
      </div>
    </section>

    <aside class="library" aria-label="Library">
      <div class="lib-head">
        <h2>Library<span class="mono" id="count"></span></h2>
        <button class="ghost" id="clearBtn" type="button">Clear all</button>
      </div>
      <ul class="list" id="list"></ul>
      <div class="lib-foot"><button class="btn" id="addBtn" type="button"><span data-i="upload"></span>Add more files</button></div>
    </aside>
  </main>
</div>

<input type="file" id="file" multiple hidden accept="image/*,audio/*,video/*,.mp3,.m4a,.flac,.opus,.mkv,.mov,.heic,.heif,.avif">
<div class="veil" id="veil" hidden><div>Drop to open</div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {

const root = document.documentElement;

/* ---------- icons ---------- */

  zx = clamp(zx, -mx, mx); zy = clamp(zy, -my, my);
}
function resetZoom() { zs = 1; zx = 0; zy = 0; applyZoom(); }
function zoomAt(f, px, py) {
  const ns = clamp(zs * f, 1, 8), r = ns / zs;
  zx = px - (px - zx) * r; zy = py - (py - zy) * r; zs = ns;

  clampPan(); applyZoom();
}
const rel = e => { const r = imgBox.getBoundingClientRect(); return [e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)]; };
imgBox.addEventListener('wheel', e => { e.preventDefault(); const [px, py] = rel(e); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, px, py); }, { passive: false });
imgBox.addEventListener('dblclick', e => { if (zs > 1) resetZoom(); else { const [px, py] = rel(e); zoomAt(2.5, px, py); } });
imgBox.addEventListener('pointerdown', e => {
  if (zs <= 1 || e.button !== 0) return;
  pan = { x: e.clientX, y: e.clientY, zx, zy };
  imgBox.setPointerCapture(e.pointerId); imgBox.classList.add('panning');
});
imgBox.addEventListener('pointermove', e => {
  if (!pan) return;
  zx = pan.zx + (e.clientX - pan.x); zy = pan.zy + (e.clientY - pan.y);
  clampPan(); applyZoom();
});
const endPan = () => { pan = null; imgBox.classList.remove('panning'); };
imgBox.addEventListener('pointerup', endPan);
imgBox.addEventListener('pointercancel', endPan);
$('zoomIn').onclick = () => zoomAt(1.4, 0, 0);
$('zoomOut').onclick = () => zoomAt(1 / 1.4, 0, 0);
$('zoomLbl').onclick = resetZoom;
window.addEventListener('resize', () => { if (zs > 1) { clampPan(); applyZoom(); } });

/* ---------- controls wiring ---------- */
const fileInput = $('file');
const openPicker = () => fileInput.click();
['openBtn', 'emptyBtn', 'addBtn'].forEach(id => { $(id).onclick = openPicker; });
fileInput.onchange = () => { const f = [...fileInput.files]; fileInput.value = ''; if (f.length) addFiles(f); };
$('clearBtn').onclick = clearAll;
$('playBtn').onclick = togglePlay;
$('prevBtn').onclick = () => go(-1);
$('nextBtn').onclick = () => go(1);
$('shuffleBtn').onclick = () => { shuffle = !shuffle; syncControls(); };
$('loopBtn').onclick = () => { loop = !loop; audioEl.loop = loop; videoEl.loop = loop; syncControls(); };
const RATES = [0.5, 0.75, 1, 1.25, 1.5, 2];
$('speedBtn').onclick = () => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  audioEl.playbackRate = rate; videoEl.playbackRate = rate; syncControls();
};
function applyVolume() { for (const el of [audioEl, videoEl]) { el.volume = volume; el.muted = muted; } setFill(vol); syncControls(); }
vol.addEventListener('input', () => { volume = vol.value / 100; muted = volume === 0; applyVolume(); });
$('muteBtn').onclick = () => { muted = !muted; if (!muted && volume === 0) { volume = 0.5; vol.value = 50; } applyVolume(); };
seek.addEventListener('pointerdown', () => { seeking = true; });
for (const ev of ['pointerup', 'pointercancel', 'change', 'blur']) seek.addEventListener(ev, () => { seeking = false; });
seek.addEventListener('input', () => {
  if (!media) return;
  const d = media.duration;
  if (isFinite(d) && d > 0) { media.currentTime = seek.value / 1000 * d; tNow.textContent = fmtTime(media.currentTime); }
  setFill(seek);
});
$('fsBtn').onclick = toggleFs;
function toggleFs() {
  if (!current || current.kind === 'audio') return;
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (player.requestFullscreen) player.requestFullscreen().catch(() => toast('Full screen is not available here.'));
  else if (current.kind === 'video' && videoEl.webkitEnterFullscreen) videoEl.webkitEnterFullscreen();
  else toast('Full screen is not available here.');
}
document.addEventListener('fullscreenchange', () => { sizeCanvas(); });

$('list').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { removeItem(+rm.dataset.rm); return; }
  const row = e.target.closest('.row');
  if (row) { const id = +row.dataset.id; if (current && current.id === id) { if (media) togglePlay(); } else select(id, true); }
});

/* keyboard */
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (!current) return;
  const k = e.key;
  if (k === ' ' && tag !== 'BUTTON') { if (media) { e.preventDefault(); togglePlay(); } }
  else if (k === 'ArrowRight') { e.preventDefault(); if (media) media.currentTime = Math.min((media.duration || 1e9), media.currentTime + 5); else go(1); }
  else if (k === 'ArrowLeft') { e.preventDefault(); if (media) media.currentTime = Math.max(0, media.currentTime - 5); else go(-1); }
  else if (k === 'ArrowUp' && media) { e.preventDefault(); volume = clamp(volume + 0.05, 0, 1); vol.value = Math.round(volume * 100); muted = false; applyVolume(); }
  else if (k === 'ArrowDown' && media) { e.preventDefault(); volume = clamp(volume - 0.05, 0, 1); vol.value = Math.round(volume * 100); applyVolume(); }
  else if (k === 'n' || k === 'N') go(1);
  else if (k === 'p' || k === 'P') go(-1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'm' || k === 'M') { if (media) { muted = !muted; applyVolume(); } }
  else if ((k === '+' || k === '=') && current.kind === 'image') zoomAt(1.4, 0, 0);
  else if (k === '-' && current.kind === 'image') zoomAt(1 / 1.4, 0, 0);
  else if (k === '0' && current.kind === 'image') resetZoom();
});

/* drag, drop, paste */
const veil = $('veil'); let depth = 0;
const hasFiles = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; veil.hidden = false; });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) veil.hidden = true; });
addEventListener('drop', e => {
  e.preventDefault(); depth = 0; veil.hidden = true;
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
addEventListener('paste', e => {
  const f = e.clipboardData && e.clipboardData.files;
  if (f && f.length) { e.preventDefault(); addFiles(f); }
});

/* theme */
try { const t = localStorage.getItem('lantern-theme'); if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t); } catch (e) {}
$('themeBtn').onclick = () => {
  const set = root.getAttribute('data-theme');
  const dark = set ? set === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const nt = dark ? 'light' : 'dark';
  root.setAttribute('data-theme', nt);
  try { localStorage.setItem('lantern-theme', nt); } catch (e) {}
  readColors(); kick();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); kick(); });

/* ---------- built-in samples ---------- */
function makeSampleImage() {
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1000;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 1000);
  sky.addColorStop(0, '#1b1f4a'); sky.addColorStop(0.5, '#8a3f6d'); sky.addColorStop(0.78, '#f08a4b'); sky.addColorStop(1, '#ffd27a');
  g.fillStyle = sky; g.fillRect(0, 0, 1600, 1000);
  for (let i = 0; i < 90; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + ((i * 37) % 60) / 100) + ')';
    g.fillRect((i * 977) % 1600, (i * 613) % 400, 2, 2);
  }
  const sg = g.createRadialGradient(1000, 640, 10, 1000, 640, 280);
  sg.addColorStop(0, '#fff3c4'); sg.addColorStop(0.35, 'rgba(255,214,130,.85)'); sg.addColorStop(1, 'rgba(255,170,90,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(1000, 640, 280, 0, Math.PI * 2); g.fill();
  [['#5a2f6b', 600, 0.9], ['#3a2559', 690, 1.3], ['#221a43', 780, 1.8], ['#120f2b', 870, 2.4]].forEach(([col, base, f], li) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, 1000);
    for (let x = 0; x <= 1600; x += 20) g.lineTo(x, base + Math.sin(x / (180 / f) + li * 2) * 40 + Math.sin(x / (70 / f) + li) * 14);
    g.lineTo(1600, 1000); g.closePath(); g.fill();
  });
  return new Promise(res => c.toBlob(b => res(b ? new File([b], 'Sample dusk.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', 0.9));
}
function makeSampleWav() {
  const sr = 22050, dur = 16, n = sr * dur, buf = new Float32Array(n);
  const notes = [220, 261.63, 329.63, 392, 440, 392, 329.63, 261.63];
  const step = 0.5;
  for (let k = 0; k < dur / step; k++) {
    const f = notes[k % notes.length] * (Math.floor(k / 8) % 2 ? 1.1225 : 1);
    const start = Math.floor(k * step * sr), len = Math.min(n - start, Math.floor(1.8 * sr));
    for (let i = 0; i < len; i++) {
      const t = i / sr;
      buf[start + i] += Math.sin(2 * Math.PI * f * t) * Math.exp(-2.6 * t) * 0.3 + Math.sin(2 * Math.PI * f * 2 * t) * Math.exp(-5 * t) * 0.09;
    }
    if (k % 4 === 0) {
      const blen = Math.min(n - start, Math.floor(2 * sr));
      for (let i = 0; i < blen; i++) { const t = i / sr; buf[start + i] += Math.sin(2 * Math.PI * (f / 2) * t) * Math.exp(-1.4 * t) * 0.22; }
    }
  }
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(buf[i]));
  const ab = new ArrayBuffer(44 + n * 2), dv = new DataView(ab);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  ws(36, 'data'); dv.setUint32(40, n * 2, true);
  const norm = peak > 0 ? 0.85 / peak : 1;
  for (let i = 0; i < n; i++) dv.setInt16(44 + i * 2, clamp(buf[i] * norm, -1, 1) * 32767, true);
  return new File([ab], 'Sample evening arpeggio.wav', { type: 'audio/wav' });
}

/* ---------- start ---------- */
readColors(); setFill(vol); setFill(seek); renderList(); showView(null); applyZoom();
(async () => {
  try {
    const img = await makeSampleImage();
    if (img) await addFiles([img], { sample: true });
    await addFiles([makeSampleWav()], { sample: true, tags: { title: 'Evening Arpeggio', artist: 'Generated in your browser' } });
  } catch (e) {}
})();
})();
</script>
